name: Build unsigned TFGBC iOS package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Check out application source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build unsigned ARM64 device app
        run: npm run ios:unsigned
      - name: Retain unsigned package for personal signing
        uses: actions/upload-artifact@v7
        with:
          name: TFGBC-ios-unsigned
          path: |
            downloads/TFGBC-ios-unsigned.ipa
            downloads/TFGBC-ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 1

