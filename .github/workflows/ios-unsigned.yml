name: Build unsigned TFGBC iOS package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - name: Download exact application source
        timeout-minutes: 4
        shell: bash
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/tfgbc-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/tfgbc-source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build unsigned ARM64 device app
        run: npm run ios:unsigned
      - name: Retain unsigned package for personal signing
        uses: actions/upload-artifact@v7
        with:
          name: TFGBC-ios-unsigned
          path: |
            downloads/TFGBC-ios-unsigned.ipa
            downloads/TFGBC-ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
