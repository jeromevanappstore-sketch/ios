<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFGBC — Church Management</title>
<meta name="description" content="TFGBC church management: members, attendance, giving, ministry groups, and reports.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --royal:#0E2A78; --cobalt:#1E4FD8; --sky:#5B8CFF; --gold:#F5B82E; --gold2:#FFD966; --goldDeep:#C98A0B;
  --bg:#EDF1FB; --surface:#FFFFFF; --surface2:#F4F7FE; --ink:#0A1640; --muted:#56638F; --line:#DCE3F4;
  --ok:#16A34A; --okbg:#E6F9EE; --okline:#86DDA6; --danger:#DC2626;
  --shadow:0 1px 0 rgba(14,42,120,.05),0 14px 32px -18px rgba(14,42,120,.45);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060D24;--surface:#0E1A3E;--surface2:#13224E;--ink:#EAF0FF;--muted:#9BA9D8;--line:#22346E;
  --okbg:#0E3324;--okline:#1F7A47;--shadow:0 16px 36px -18px rgba(0,0,0,.8);color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#060D24;--surface:#0E1A3E;--surface2:#13224E;--ink:#EAF0FF;--muted:#9BA9D8;--line:#22346E;--okbg:#0E3324;--okline:#1F7A47;--shadow:0 16px 36px -18px rgba(0,0,0,.8);color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
svg{flex-shrink:0}

/* Layout */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px;color:#fff;
  background:radial-gradient(120% 50% at 0% 0%,rgba(91,140,255,.35),transparent 60%),linear-gradient(180deg,#0A1E5E,#0E2A78 60%,#11318C)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(160deg,#FFE28A,#F5B82E 60%,#D99510);
  box-shadow:0 4px 0 #A8730A,0 10px 22px -6px rgba(245,184,46,.7)}
.brand b{display:block;font:800 15.5px/1.15 var(--display);letter-spacing:.1px;max-width:150px}
.brand small{color:#A9BAF2;font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:13px;background:none;color:#C5D2FF;font-weight:600;font-size:14.5px;cursor:pointer;transition:background .15s,color .15s;text-align:left}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{color:#fff;background:linear-gradient(180deg,#3369F5,#1E4FD8);box-shadow:0 4px 0 #0B2B92,0 12px 22px -10px rgba(30,79,216,.9)}
.sfoot{margin-top:auto;display:grid;gap:10px;padding:0 6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13.5px;color:#D6E0FF;cursor:pointer;border:0;width:100%}
.tg{width:38px;height:22px;border-radius:99px;background:#3B4E8F;position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--gold)}.tg.on::after{transform:translateX(16px)}
.savest{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#A9BAF2;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:#34D27B;box-shadow:0 0 0 3px rgba(52,210,123,.2)}
.dot.busy{background:var(--gold);box-shadow:0 0 0 3px rgba(245,184,46,.25)}
.dot.err{background:#F05252}

main{padding:26px 30px 110px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font:800 30px/1.1 var(--display);letter-spacing:-.4px}
.top p{color:var(--muted);font-size:14px;margin-top:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.view{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:perspective(1400px) rotateX(7deg) translateY(16px)}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:0;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#3E70F7,var(--cobalt));box-shadow:0 4px 0 #13379E,0 10px 18px -10px rgba(30,79,216,.8);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #13379E}
.btn.gold{color:#3A2600;background:linear-gradient(180deg,#FFE07A,#F5B82E);box-shadow:0 4px 0 #B67C08,0 10px 18px -10px rgba(245,184,46,.9)}
.btn.gold:active{box-shadow:0 1px 0 #B67C08}
.btn.ghost{color:var(--ink);background:var(--surface);box-shadow:0 3px 0 var(--line),inset 0 0 0 1px var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line),inset 0 0 0 1px var(--line)}
.btn.red{background:linear-gradient(180deg,#F06262,#DC2626);box-shadow:0 4px 0 #9B1C1C}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.ib:hover{color:var(--cobalt);border-color:var(--sky)}
.ib.del:hover{color:var(--danger);border-color:#F3A3A3}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h3{font:700 17px/1.2 var(--display)}
.ph span{color:var(--muted);font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.g2.wide{grid-template-columns:1.35fr 1fr}

/* Hero with 3D church */
.hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;display:grid;grid-template-columns:1.1fr 1fr;min-height:300px;
  background:radial-gradient(60% 80% at 78% 40%,rgba(255,214,102,.45),transparent 60%),radial-gradient(80% 90% at 0% 100%,rgba(91,140,255,.45),transparent 60%),linear-gradient(135deg,#0A1E5E,#163BB0 70%,#1E4FD8);
  box-shadow:0 24px 50px -24px rgba(14,42,120,.75)}
.hero::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 72% 38%,rgba(255,236,170,.10) 0 6deg,transparent 6deg 18deg);pointer-events:none}
.hcopy{position:relative;padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;z-index:2}
.hcopy .greet{color:#C9D6FF;font-weight:600;font-size:14.5px}
.hcopy h2{font:800 clamp(30px,4vw,46px)/1.02 var(--display);letter-spacing:-.8px;
  background:linear-gradient(180deg,#FFF4C2 0%,#FFD45A 45%,#F0A51C 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #9C6A05) drop-shadow(0 4px 0 #6E4A02) drop-shadow(0 12px 18px rgba(0,0,0,.35))}
.hcopy p{color:#E2E9FF;max-width:46ch;font-size:15px}
.hcopy .acts{margin-top:8px}
.btn.glass{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 4px 0 rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.scene{position:relative;min-height:300px;perspective:900px;perspective-origin:50% 35%;cursor:pointer}
.dio{position:absolute;left:50%;top:60%;transform-style:preserve-3d;will-change:transform}
.pl{position:absolute;left:0;top:0;transform-style:preserve-3d;backface-visibility:visible}
.tri{clip-path:polygon(50% 0,100% 100%,0 100%)}
.arch{border-radius:50% 50% 3px 3px/38% 38% 3px 3px}
.lit{box-shadow:0 0 12px 3px rgba(255,205,90,.8)}
.ring{border-radius:50%}
.halo{position:absolute;left:50%;top:22%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.55),rgba(255,200,80,.12) 45%,transparent 70%);filter:blur(4px);pointer-events:none}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.tile{position:relative;display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .18s ease-out;cursor:pointer}
.ic{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;transform:translateZ(34px);flex-shrink:0}
.ic.b{background:linear-gradient(160deg,#6B9BFF,#1E4FD8);box-shadow:0 5px 0 #13379E,0 14px 22px -10px rgba(30,79,216,.9)}
.ic.g{background:linear-gradient(160deg,#5BE08E,#16A34A);box-shadow:0 5px 0 #0E7034,0 14px 22px -10px rgba(22,163,74,.9)}
.ic.y{background:linear-gradient(160deg,#FFE07A,#F5B82E);box-shadow:0 5px 0 #B67C08,0 14px 22px -10px rgba(245,184,46,.9)}
.tile .lb{color:var(--muted);font-weight:600;font-size:13.5px}
.tile .num{font:800 32px/1.05 var(--display);letter-spacing:-.5px;transform:translateZ(20px)}
.tile .sub{color:var(--muted);font-size:12.5px}

/* Lists, tables, chips */
.rows{display:grid;gap:4px}
.row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px}
.row:hover{background:var(--surface2)}
.row .nm{font-weight:700}
.row .mt{color:var(--muted);font-size:12.5px}
.row .end{margin-left:auto;text-align:right}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;background:var(--c,#1E4FD8);background-size:cover;background-position:center;flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
.st.Active{background:var(--okbg);color:var(--ok)}
.st.Visitor{background:color-mix(in srgb,var(--gold) 20%,transparent);color:#B07A06}
.st.Inactive{background:var(--surface2);color:var(--muted)}
.tw{overflow-x:auto;margin:0 -6px}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px}
.tbl td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--surface2)}
.tbl .r{text-align:right}
.who{display:flex;align-items:center;gap:11px}
.who b{display:block;font-weight:700}
.who small{color:var(--muted);font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools .search{flex:1;min-width:200px;position:relative}
.tools .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tools .search input{padding-left:38px;width:100%}
.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px var(--display);margin-bottom:4px}
.empty .btn{margin-top:14px}

/* Forms */
input,select,textarea{font-size:14.5px;font-weight:500;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px color-mix(in srgb,var(--sky) 22%,transparent)}
textarea{resize:vertical;min-height:70px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}

/* Modal */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(4,10,36,.55);backdrop-filter:blur(6px);perspective:1200px}
.md{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:swing .38s cubic-bezier(.2,.9,.3,1.15);transform-origin:50% 0}
@keyframes swing{from{opacity:0;transform:rotateX(-28deg) translateY(30px) scale(.96)}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
.mh h3{font:800 21px var(--display)}
.mb{padding:18px 22px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 22px}
.photo{display:flex;align-items:center;gap:14px}
.photo .av{width:64px;height:64px;border-radius:18px;font-size:20px}

/* Attendance roll */
.attbar{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-bottom:14px}
.roll{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-height:460px;overflow:auto;padding:2px}
.pk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;text-align:left;color:var(--ink);transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;width:100%}
.pk:active{transform:scale(.97)}
.pk .ck{margin-left:auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex-shrink:0}
.pk.on{background:var(--okbg);border-color:var(--okline);box-shadow:0 3px 0 var(--okline)}
.pk.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.pk b{font-size:14px;display:block;line-height:1.2}
.pk small{color:var(--muted);font-size:12px}
.counter{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.counter .big{font:800 28px var(--display)}
.counter .lb{color:var(--muted);font-size:13px}
.vis{display:flex;align-items:center;gap:6px}
.vis input{width:70px;text-align:center}

/* Giving */
.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.pill{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.pill .lb{font-size:13px;color:var(--muted);font-weight:600}
.pill .v{font:800 20px var(--display)}
.pill.total{background:linear-gradient(160deg,#FFE48F,#F5B82E);border-color:#E9A91C;color:#3A2600}
.pill.total .lb{color:#6B4A00}
.amt{font-weight:800;font-variant-numeric:tabular-nums}

/* Groups */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gc{position:relative;overflow:hidden;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.gc::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
.gc h4{font:800 18px var(--display);margin-top:4px}
.gc .ld{color:var(--muted);font-size:13px}
.gc .cnt{font:800 34px var(--display);color:var(--c);margin-top:10px;line-height:1}
.stack{display:flex;margin-top:12px}
.stack .av{width:30px;height:30px;border-radius:50%;font-size:11px;border:2px solid var(--surface);margin-left:-8px;box-shadow:none}
.stack .av:first-child{margin-left:0}
.gc .gact{position:absolute;top:16px;right:14px;display:flex;gap:6px}

/* Reports */
.hb{display:grid;gap:10px}
.hbr{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;font-size:14px}
.trk{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.trk i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,#FFE07A,#E9A91C);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.kpi .v{font:800 26px var(--display)}
.kpi .lb{color:var(--muted);font-size:13px;font-weight:600}
canvas{display:block;width:100%;height:220px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:#0A1640;color:#fff;font-weight:600;font-size:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);animation:tin .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px) scale(.95)}}
.bnav{display:none}
.hide-d{display:none}

@media (max-width:1080px){.stats{grid-template-columns:1fr 1fr 1fr}.g2,.g2.wide{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}.side{display:none}
  main{padding:18px 14px 120px}
  .top h1{font-size:25px}
  .hero{grid-template-columns:1fr}.hcopy{padding:26px 22px 6px}.scene{min-height:250px}
  .stats{grid-template-columns:1fr}
  .attbar{grid-template-columns:1fr 1fr}.attbar .btn{grid-column:1/-1}
  .fg{grid-template-columns:1fr}
  .hbr{grid-template-columns:90px 1fr 92px;font-size:13px}
  .hide-d{display:inline-grid}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:2px;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,#0E2A78,#0A1E5E);box-shadow:0 -10px 30px -10px rgba(0,0,0,.5)}
  .bnav button{flex:1 0 auto;min-width:68px;display:grid;justify-items:center;gap:3px;padding:7px 6px;border:0;border-radius:12px;background:none;color:#B5C4F5;font-size:11px;font-weight:700;cursor:pointer}
  .bnav button.on{color:#fff;background:linear-gradient(180deg,#3369F5,#1E4FD8);box-shadow:0 3px 0 #0B2B92}
  .toast{bottom:92px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .side,.bnav,.acts,.noprint,.toast{display:none!important}
  .app{display:block}main{padding:0}body{background:#fff;color:#000}
  .panel,.kpi{box-shadow:none;break-inside:avoid;border-color:#ccc}
  .view{animation:none}
}

@media (min-width:861px) and (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{flex-direction:column;align-items:flex-start;gap:12px;min-width:0}.tile .num{font-size:28px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A2600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v5M9.5 4.5h5M5 21V12l7-5 7 5v9"/><path d="M10 21v-4a2 2 0 0 1 4 0v4M3 21h18"/></svg></div>
      <div><b id="sbName">Church</b><small>Church Management</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">
      <button class="sw" data-act="sound"><span>Sound effects</span><span class="tg" id="sndTg"></span></button>
      <div class="savest"><span class="dot" id="saveDot"></span><span id="saveTx">Loading…</span></div>
    </div>
  </aside>
  <main><div class="wrap" id="root"></div></main>
</div>

let AC;
function ctx(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',g=.07,delay=0,to){
  const c=ctx(),t=c.currentTime+delay,o=c.createOscillator(),v=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.05);
}

function readDB(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function setSave(t,kind){$('#saveTx').textContent=t;$('#saveDot').className='dot'+(kind?' '+kind:'')}

  setSave('Saving…','busy');clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    if(!db){setSave('Not saved — browser storage is off','err');return}
    try{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);
      tx.oncomplete=()=>setSave('All changes saved');tx.onerror=()=>setSave('Save failed — download a backup','err');}
    catch(e){setSave('Save failed — download a backup','err')}
  },300);
}

function pl(w,h,tf,bg,cls=''){return`<div class="pl ${cls}" style="width:${w}px;height:${h}px;margin:${-h/2}px 0 0 ${-w/2}px;transform:${tf};background:${bg}"></div>`}
function box(x,y,z,w,h,d,c){return pl(w,h,`translate3d(${x}px,${y}px,${z+d/2}px)`,c.f)+pl(w,h,`translate3d(${x}px,${y}px,${z-d/2}px) rotateY(180deg)`,c.b||c.f)+pl(d,h,`translate3d(${x+w/2}px,${y}px,${z}px) rotateY(90deg)`,c.s)+pl(d,h,`translate3d(${x-w/2}px,${y}px,${z}px) rotateY(-90deg)`,c.s)+pl(w,d,`translate3d(${x}px,${y-h/2}px,${z}px) rotateX(90deg)`,c.t)}
function gable(x,yb,z,w,rh,d,cf,cr){const L=Math.hypot(w/2,rh)+3,th=Math.atan2(rh,w/2)*180/Math.PI;
  return pl(w,rh,`translate3d(${x}px,${yb-rh/2}px,${z+d/2}px)`,cf,'tri')+pl(w,rh,`translate3d(${x}px,${yb-rh/2}px,${z-d/2}px) rotateY(180deg)`,cf,'tri')
   +pl(L,d+8,`translate3d(${x-w/4}px,${yb-rh/2}px,${z}px) rotateZ(${-th}deg) rotateX(90deg)`,cr)+pl(L,d+8,`translate3d(${x+w/4}px,${yb-rh/2}px,${z}px) rotateZ(${th}deg) rotateX(90deg)`,cr)}

/* ========== Charts (3D bars + glow line) ========== */
function prep(cv){const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);return[c,w,h]}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function bars(cv,labels,vals){
  if(!cv)return;const[c,W,H]=prep(cv),P={l:34,r:14,t:22,b:28},mx=Math.max(4,...vals)*1.15,n=vals.length||1,bw=(W-P.l-P.r)/n,ch=H-P.t-P.b;
  c.font='600 11px Figtree,system-ui';c.fillStyle=cssv('--muted');c.strokeStyle=cssv('--line');
  for(let i=0;i<=4;i++){const y=P.t+ch*i/4;c.beginPath();c.moveTo(P.l,y);c.lineTo(W-P.r,y);c.stroke();c.fillText(Math.round(mx*(1-i/4)),4,y+4)}
  if(!vals.length){c.fillText('No data yet',W/2-30,H/2);return}
  vals.forEach((v,i)=>{const h=ch*v/mx,w=Math.min(38,bw*.55),x=P.l+i*bw+(bw-w)/2,y=P.t+ch-h,dx=7,dy=5;
    const gr=c.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#6E9BFF');gr.addColorStop(1,'#1E4FD8');
    c.fillStyle='#13379E';c.beginPath();c.moveTo(x+w,y);c.lineTo(x+w+dx,y-dy);c.lineTo(x+w+dx,y+h-dy);c.lineTo(x+w,y+h);c.fill();
    c.fillStyle='#A9C3FF';c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y-dy);c.lineTo(x+w+dx,y-dy);c.lineTo(x+w,y);c.fill();
    c.fillStyle=gr;c.fillRect(x,y,w,h);
    c.fillStyle=cssv('--ink');c.textAlign='center';c.font='800 11.5px Figtree,system-ui';c.fillText(v,x+w/2+3,y-dy-5);
    c.fillStyle=cssv('--muted');c.font='600 11px Figtree,system-ui';c.fillText(labels[i],x+w/2,H-9);c.textAlign='left';});
}
function line(cv,labels,vals){
  if(!cv)return;const[c,W,H]=prep(cv),P={l:48,r:18,t:22,b:28},mx=Math.max(1000,...vals)*1.15,ch=H-P.t-P.b,n=vals.length;
  c.font='600 11px Figtree,system-ui';c.fillStyle=cssv('--muted');c.strokeStyle=cssv('--line');
  for(let i=0;i<=4;i++){const y=P.t+ch*i/4;c.beginPath();c.moveTo(P.l,y);c.lineTo(W-P.r,y);c.stroke();c.fillText(pesoShort(mx*(1-i/4)),2,y+4)}
  const pt=i=>[P.l+(W-P.l-P.r)*(n<2?.5:i/(n-1)),P.t+ch*(1-vals[i]/mx)];
  const ar=c.createLinearGradient(0,P.t,0,H-P.b);ar.addColorStop(0,'rgba(245,184,46,.45)');ar.addColorStop(1,'rgba(245,184,46,0)');
  c.beginPath();vals.forEach((v,i)=>{const[x,y]=pt(i);i?c.lineTo(x,y):c.moveTo(x,y)});c.lineTo(pt(n-1)[0],H-P.b);c.lineTo(pt(0)[0],H-P.b);c.fillStyle=ar;c.fill();
  c.save();c.shadowColor='rgba(201,138,11,.55)';c.shadowBlur=10;c.shadowOffsetY=4;c.beginPath();vals.forEach((v,i)=>{const[x,y]=pt(i);i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle='#E9A91C';c.lineWidth=3.5;c.lineJoin='round';c.stroke();c.restore();
  vals.forEach((v,i)=>{const[x,y]=pt(i);c.beginPath();c.arc(x,y,5.5,0,7);c.fillStyle='#FFD966';c.fill();c.lineWidth=2.5;c.strokeStyle='#B67C08';c.stroke();
    c.fillStyle=cssv('--muted');c.textAlign='center';c.fillText(labels[i],x,H-9);c.textAlign='left'});
}

  const f=$('#mform');setTimeout(()=>f.querySelector('input:not([type=hidden]):not([type=file]),select')?.focus(),60);

function validateBackup(d) {
  const fail = message => { throw new Error('Invalid backup: ' + message); };
  const object = (value, name) => {
    if (!value || typeof value !== 'object' || Array.isArray(value)) fail(name + ' must be an object');
    return value;
  };
  const text = (value, name, fallback = '') => {
    if (value === undefined || value === null) return fallback;
    if (typeof value !== 'string') fail(name + ' must be text');
    return value;
  };
  const id = (value, name, optional = false) => {
    if (optional && (value === undefined || value === null || value === '')) return '';
    if (typeof value !== 'string' || !/^[A-Za-z0-9_-]+$/.test(value)) fail(name + ' is invalid');
    return value;
  };
  const date = (value, name, optional = false) => {
    if (optional && (value === undefined || value === null || value === '')) return '';
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) fail(name + ' is invalid');
    const parsed = new Date(value + 'T00:00:00Z');
    if (!Number.isFinite(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== value) fail(name + ' is invalid');
    return value;
  };
  const choice = (value, options, name) => {
    if (!options.includes(value)) fail(name + ' is invalid');
    return value;
  };
  const number = (value, name, integer = false) => {
    if (typeof value !== 'number' || !Number.isFinite(value) || value < 0 || (integer && !Number.isSafeInteger(value))) fail(name + ' is invalid');
    return value;
  };
  const seenIds = new Set();
  const recordId = (value, name) => {
    const checked = id(value, name);
    if (seenIds.has(checked)) fail('duplicate record ID');
    seenIds.add(checked);
    return checked;
  };
  const photo = value => {
    const checked = text(value, 'member photo');
    if (!checked) return '';
    const match = /^data:image\/(png|jpeg|jpg|gif|webp|avif|bmp);base64,([A-Za-z0-9+/]+={0,2})$/i.exec(checked);
    if (!match || match[2].length % 4 !== 0) fail('member photo must be a raster image data URL');
    let bytes;
    try { bytes = atob(match[2]); } catch (_) { fail('member photo contains invalid image data'); }
    const mime = match[1].toLowerCase();
    const valid = {
      png: () => bytes.slice(0, 8) === '\x89PNG\r\n\x1a\n',
      jpeg: () => bytes.startsWith('\xff\xd8\xff'),
      jpg: () => bytes.startsWith('\xff\xd8\xff'),
      gif: () => /^(GIF87a|GIF89a)/.test(bytes),
      webp: () => bytes.startsWith('RIFF') && bytes.slice(8, 12) === 'WEBP',
      avif: () => bytes.slice(4, 8) === 'ftyp' && /(?:avif|avis)/.test(bytes.slice(8, 32)),
      bmp: () => bytes.startsWith('BM')
    };
    if (!valid[mime]()) fail('member photo content does not match its image type');
    return checked;
  };

  object(d, 'backup');
  if (d.v !== 1) fail('unsupported backup version');
  const settings = object(d.settings, 'settings');
  for (const key of ['groups', 'members', 'attendance', 'giving']) {
    if (!Array.isArray(d[key])) fail(key + ' must be an array');
  }
  if (settings.sound !== undefined && typeof settings.sound !== 'boolean') fail('sound setting must be true or false');
  const groups = d.groups.map(value => {
    const g = object(value, 'group');
    const name = text(g.name, 'group name').trim();
    if (!name) fail('group name is required');
    if (typeof g.color !== 'string' || !/^#[0-9a-f]{6}$/i.test(g.color)) fail('group color is invalid');
    return {id: recordId(g.id, 'group ID'), name, leader: text(g.leader, 'group leader'), color: g.color};
  });
  const groupIds = new Set(groups.map(g => g.id));
  const memberNos = new Set();
  let largestNo = 0;
  const members = d.members.map(value => {
    const m = object(value, 'member');
    const no = number(m.no, 'member number', true);
    if (no < 1 || no >= Number.MAX_SAFE_INTEGER || memberNos.has(no)) fail('member numbers must be unique positive integers');
    memberNos.add(no);
    largestNo = Math.max(largestNo, no);
    const first = text(m.first, 'first name').trim(), last = text(m.last, 'last name').trim();
    if (!first || !last) fail('member first and last names are required');
    const groupId = id(m.groupId, 'member group ID', true);
    return {
      id: recordId(m.id, 'member ID'), no, first, last,
      gender: choice(m.gender === undefined ? '' : m.gender, ['', 'Male', 'Female'], 'gender'),
      birth: date(m.birth, 'birthday', true), phone: text(m.phone, 'mobile number'),
      email: text(m.email, 'email'), address: text(m.address, 'member address'),
      groupId: groupIds.has(groupId) ? groupId : '',
      status: choice(m.status, ['Active', 'Visitor', 'Inactive'], 'member status'),
      joined: date(m.joined, 'joined date', true), notes: text(m.notes, 'member notes'), photo: photo(m.photo)
    };
  });
  const memberIds = new Set(members.map(m => m.id));
  const services = ['Sunday Worship', 'Midweek Prayer', 'Youth Service', 'Bible Study', 'Special Event'];
  const serviceKeys = new Set();
  const attendance = d.attendance.map(value => {
    const a = object(value, 'attendance');
    const checkedDate = date(a.date, 'attendance date');
    const service = choice(a.service, services, 'service');
    const serviceKey = checkedDate + ':' + service;
    if (serviceKeys.has(serviceKey)) fail('duplicate attendance date and service');
    serviceKeys.add(serviceKey);
    if (!Array.isArray(a.present)) fail('members present must be an array');
    const presentIds = new Set();
    const present = a.present.map(value => {
      const checked = id(value, 'present member ID');
      if (presentIds.has(checked)) fail('duplicate member in attendance');
      presentIds.add(checked);
      return checked;
    }).filter(value => memberIds.has(value));
    return {id: recordId(a.id, 'attendance ID'), date: checkedDate, service, present,
      visitors: number(a.visitors, 'visitor count', true), notes: text(a.notes, 'attendance notes')};
  });
  const giving = d.giving.map(value => {
    const g = object(value, 'giving record');
    const memberId = id(g.memberId, 'giver ID', true);
    return {id: recordId(g.id, 'giving ID'), date: date(g.date, 'giving date'),
      memberId: memberIds.has(memberId) ? memberId : '',
      type: choice(g.type, ['Tithe', 'Offering', 'Love Gift', 'Missions', 'Building Fund', 'Pledge'], 'giving type'),
      amount: number(g.amount, 'giving amount'),
      method: choice(g.method, ['Cash', 'GCash', 'Bank Transfer', 'Check'], 'giving method'),
      ref: text(g.ref, 'giving reference')};
  });
  const requestedNext = Number.isSafeInteger(settings.nextNo) && settings.nextNo > 0 && settings.nextNo < Number.MAX_SAFE_INTEGER ? settings.nextNo : 1;
  return {v: 1, settings: {
    church: text(settings.church, 'church name'), pastor: text(settings.pastor, 'pastor name'),
    address: text(settings.address, 'church address'), sound: settings.sound === undefined ? true : settings.sound,
    nextNo: Math.max(largestNo + 1, requestedNext)
  }, groups, members, attendance, giving};
}

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(rows){return'\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n')}
const slug=()=>(state.settings.church||'church').replace(/[^a-z0-9]+/gi,'-').toLowerCase();

/* ========== Actions ========== */
const A={
  sound(){state.settings.sound=!state.settings.sound;persist();renderNav();if(ui.view==='settings')render();if(state.settings.sound)sfx('mark');toast(state.settings.sound?'Sound on':'Sound off')},
  goAtt(){go('attendance')},
  addMember(){openMember()},editMember(el){openMember(el.dataset.id)},
  delMember(el){const m=memberOf(el.dataset.id);confirmBox('Delete member?',`${esc(fullName(m))} will be removed from members and attendance. Giving records stay, marked as Anonymous.`,'Delete member',()=>{
    state.members=state.members.filter(x=>x.id!==m.id);state.attendance.forEach(s=>s.present=s.present.filter(i=>i!==m.id));state.giving.forEach(g=>{if(g.memberId===m.id)g.memberId=''});sfx('del');toast('Member deleted');commit();})},
  addGiving(){openGiving()},editGiving(el){openGiving(el.dataset.id)},
  delGiving(el){const g=state.giving.find(x=>x.id===el.dataset.id);confirmBox('Delete this record?',`${peso(g.amount)} ${g.type.toLowerCase()} on ${fmtDate(g.date)} will be removed.`,'Delete record',()=>{state.giving=state.giving.filter(x=>x!==g);sfx('del');toast('Record deleted');commit();})},
  addGroup(){openGroup()},editGroup(el){openGroup(el.dataset.id)},
  delGroup(el){const g=groupOf(el.dataset.id);confirmBox('Delete group?',`${esc(g.name)} will be removed. Its members stay on record without a group.`,'Delete group',()=>{state.groups=state.groups.filter(x=>x!==g);state.members.forEach(m=>{if(m.groupId===g.id)m.groupId=''});sfx('del');toast('Group deleted');commit();})},
  attTog(el){const id=el.dataset.id,p=ui.att.present;if(p.has(id)){p.delete(id);el.classList.remove('on');sfx('unmark')}else{p.add(id);el.classList.add('on');sfx('mark')}el.setAttribute('aria-pressed',String(p.has(id)));updCount()},
  attAll(){state.members.filter(m=>m.status!=='Inactive').forEach(m=>ui.att.present.add(m.id));$('#roll').innerHTML=rollHTML();updCount();sfx('success')},
  attNone(){ui.att.present.clear();$('#roll').innerHTML=rollHTML();updCount();sfx('unmark')},
  attSave(){const a=ui.att;if(!a.date){toast('Pick a date first');return}
    const rec={id:a.id||uid(),date:a.date,service:a.service,present:[...a.present],visitors:Number(a.visitors)||0,notes:''};
    const dup=state.attendance.find(x=>x.date===a.date&&x.service===a.service&&x.id!==rec.id);if(dup)state.attendance=state.attendance.filter(x=>x!==dup);
    const i=state.attendance.findIndex(x=>x.id===rec.id);i>=0?state.attendance[i]=rec:state.attendance.push(rec);a.id=rec.id;
    sfx('success');toast(`Saved — ${sessTotal(rec)} attended ${rec.service}`);commit();},
  attEdit(el){initAtt(null,null,el.dataset.id);ui.aq='';sfx('tap');render();scrollPageTop('smooth')},
  attDel(el){const s=state.attendance.find(x=>x.id===el.dataset.id);confirmBox('Delete attendance?',`${esc(s.service)} on ${fmtDate(s.date)} will be removed.`,'Delete',()=>{state.attendance=state.attendance.filter(x=>x!==s);if(ui.att&&ui.att.id===s.id)ui.att=null;sfx('del');toast('Attendance deleted');commit();})},
  csvMembers(){download(slug()+'-members.csv',csv([['Member No','First Name','Last Name','Gender','Birthday','Mobile','Email','Address','Group','Status','Date Joined','Notes'],...state.members.map(m=>[memberNo(m),m.first,m.last,m.gender,m.birth,m.phone,m.email,m.address,groupOf(m.groupId)?.name||'',m.status,m.joined,m.notes])]),'text/csv');sfx('success');toast('Members exported')},
  csvGiving(){const m=ui.view==='reports'?ui.rm:ui.gm;download(slug()+'-giving-'+m+'.csv',csv([['Date','Giver','Type','Amount','Method','Reference'],...state.giving.filter(g=>g.date.startsWith(m)).sort((a,b)=>a.date<b.date?-1:1).map(g=>[g.date,fullName(memberOf(g.memberId)),g.type,g.amount,g.method,g.ref])]),'text/csv');sfx('success');toast('Giving exported')},
  csvAtt(){download(slug()+'-attendance.csv',csv([['Date','Service','Members Present','Visitors','Total','Names'],...sessions().map(s=>[s.date,s.service,s.present.length,s.visitors,sessTotal(s),s.present.map(i=>fullName(memberOf(i))).join('; ')])]),'text/csv');sfx('success');toast('Attendance exported')},
  print(){sfx('tap');window.print()},
  backup(){download(slug()+'-backup-'+today()+'.json',JSON.stringify(state),'application/json');sfx('success');toast('Backup downloaded')},
  restore(){$('#restoreFile').click()},
  demo(){confirmBox('Load sample data?','This replaces all current records with sample members, attendance, and giving. Download a backup first if you need your data.','Load sample data',()=>{const snd=state.settings.sound;state=seed();state.settings.sound=snd;ui.att=null;sfx('success');toast('Sample data loaded');commit();})},
  wipe(){confirmBox('Erase all records?','Every member, attendance record, giving record, and group will be erased from this device. This cannot be undone.','Erase everything',()=>{state=blank();ui.att=null;sfx('del');toast('All records erased');commit();})},
  phClear(){$('#phData').value='';$('#phPrev').innerHTML=`<span class="av" style="background:var(--surface2);color:var(--muted)">${I.users}</span>`},
  close(){closeModal()},
  moreNav(){openMoreNav()},
  moreView(el){go(el.dataset.view)},
  ovClose(el,e){if(e.target===el)closeModal()}
};
function updCount(){const a=ui.att;$('#aCount').textContent=a.present.size;$('#aTotal').textContent=a.present.size+(Number(a.visitors)||0)}
function scrollPageTop(behavior='auto'){document.querySelector('#root')?.scrollTo({top:0,left:0,behavior});window.scrollTo({top:0,left:0,behavior})}
function go(v){closeModal();if(ui.view===v)return;ui.view=v;sfx('nav');render();scrollPageTop()}

document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v&&!e.target.closest('[data-act]')){go(v.dataset.view);return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){if(a.dataset.act==='ovClose'&&e.target!==a)return;if(!['attTog','sound','close','ovClose'].includes(a.dataset.act))sfx('tap');A[a.dataset.act](a,e)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='mq'){ui.mq=t.value;$('#mlist').innerHTML=membersList()}
  else if(t.id==='aq'){ui.aq=t.value;$('#roll').innerHTML=rollHTML()}
  else if(t.id==='gq'){ui.gq=t.value;const p=t.selectionStart;render();const n=$('#gq');n.focus();n.setSelectionRange(p,p)}
  else if(t.id==='aVis'){ui.att.visitors=Math.max(0,parseInt(t.value)||0);updCount()}
  else if(t.dataset.set){state.settings[t.dataset.set]=t.value;persist();renderNav()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='mg'){ui.mg=t.value;$('#mlist').innerHTML=membersList()}
  else if(t.id==='ms'){ui.ms=t.value;$('#mlist').innerHTML=membersList()}
  else if(t.id==='gm'&&t.value){ui.gm=t.value;render()}
  else if(t.id==='rm'&&t.value){ui.rm=t.value;render()}
  else if(t.id==='aDate'||t.id==='aSvc'){initAtt($('#aDate').value,$('#aSvc').value);sfx('tap');render()}
  else if(t.id==='phFile'&&t.files[0]){resizeImg(t.files[0],u=>{$('#phData').value=u;$('#phPrev').innerHTML=`<span class="av" style="background-image:url('${u}')"></span>`})}
  else if(t.id==='restoreFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=validateBackup(JSON.parse(r.result));
      state=d;ui.att=null;sfx('success');toast(`Restored ${d.members.length} members`);commit();}
    catch(err){toast('That file is not a valid backup from this app')}t.value=''};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{
  const form=$('#mform');if(!form)return;
  if(e.key==='Escape'){closeModal();return}
  if(e.key==='Tab'){
    const items=[...form.querySelectorAll('button,input:not([type=hidden]),select,textarea,a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey&&(document.activeElement===first||!form.contains(document.activeElement))){e.preventDefault();last?.focus()}
    else if(!e.shiftKey&&(document.activeElement===last||!form.contains(document.activeElement))){e.preventDefault();first?.focus()}
  }
});

/* 3D tilt on cards */
let tiltEl=null;
document.addEventListener('pointermove',e=>{
  if(reduceMotion||e.pointerType==='touch')return;
  const el=e.target.closest('.tilt');
  if(tiltEl&&tiltEl!==el){tiltEl.style.setProperty('--rx','0deg');tiltEl.style.setProperty('--ry','0deg')}
  tiltEl=el;if(!el)return;
  const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  el.style.setProperty('--ry',(x*14)+'deg');el.style.setProperty('--rx',(-y*12)+'deg');
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,150)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawCharts);


/* ========== Boot ========== */
(async()=>{
  try{db=await openDB();const v=await readDB();state=v||seed();if(!v)persist();else setSave('All changes saved')}
  catch(e){db=null;state=seed();setSave('Not saved — browser storage is off','err')}
  render();
  if(document.fonts)document.fonts.ready.then(drawCharts);
})();
</script>
</body>
</html>
